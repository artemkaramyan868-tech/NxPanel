<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NXPanel — Մուտք</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-page">
    <div class="auht-card">
      <div class="brand"><span class="brand-mark">NX</span><span>NXPanel</span></div>
      <div class="evebrow">WELCOME BACK 🖐️</div>
      <h1>ԲԱՐԻ ՎԵՐԱԴԱՐՁ 🖐️</h1>
      <p class="muted">Մուտք գործիր քո demo հաշիվ:</p>
      <form id="loginForm">
        <label>Nickname<input id="loginUsername" required placeholder="nyrox"></label>
        <label>Գախտնաբառ<input id="loginPassword" required type="password" placeholder="•••••••"></label>
        <button class="primary" type="submit">Մուտք Գործել →</button>
      </form>
      <p class="switch">Դեռ հաշիվ չունես: <a href="register.html">Գրանցվել</a></p>
    </div>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
