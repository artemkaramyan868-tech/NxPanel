<!DOCKTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NXPanel — Գրանցվել</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="brand"><span class="brand-mark">NX</span><span>NXPanel</span></div>
      <div class="eyebrow">GET STARTED</div>
      <h1>Ստեղծել Հաշիվ ✈️</h1>
      <p class="muted">սա frontend demo registration է։</p>
      <form id="registerForm">
        <label>Nickname<input id="registerUsername" required placeholder="nyrox"></label>
        <label>Էլ. Փոստ<input id="registerEmail" required type="email" placeholder="դու@օրինակ.com"></label>
        <label>Գախտնաբառ<input id="registerPassword" required type="password" minlength="4" placeholder="•••••"></label>
        <button class="primary" type="submit">Ստեղծել Հաշիվ →</button>
      </form>
      <p class="switch">Արդեն ունես Հաշիվ։ <a href="login.htnl">Մուտք Գործել</a></p>
    </div>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
